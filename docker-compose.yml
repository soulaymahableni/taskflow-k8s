# Phase 0 : test local des trois niveaux.  Lancer : docker compose up --build
# Les secrets sont lus depuis le fichier .env (non versionné, voir .env.example).
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: taskdb
    volumes: [ "pgdata:/var/lib/postgresql/data" ]
  api-svc:
    build: ./app/api
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: taskdb
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      API_PORT: "3000"
    depends_on: [ db ]
  frontend:
    build: ./app/frontend
    volumes: [ "./app/frontend/default.conf:/etc/nginx/conf.d/default.conf:ro" ]
    ports: [ "8080:8080" ]
    depends_on: [ api-svc ]
volumes:
  pgdata:
