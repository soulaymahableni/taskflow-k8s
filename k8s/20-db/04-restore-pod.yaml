# Pod outil pour la restauration (créé seulement au moment de restaurer, puis supprimé).
# Label tier=backup : la NetworkPolicy (phase 10) l'autorisera à joindre la base.
apiVersion: v1
kind: Pod
metadata:
  name: restore
  namespace: taskapp
  labels: { app: taskflow, tier: backup }
spec:
  serviceAccountName: backup-sa
  automountServiceAccountToken: false
  restartPolicy: Never
  securityContext:
    runAsNonRoot: true
    runAsUser: 70
    runAsGroup: 70
    seccompProfile: { type: RuntimeDefault }
  containers:
    - name: restore
      image: postgres:16-alpine
      command: ["sleep", "3600"]
      env:
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef: { name: db-credentials, key: POSTGRES_USER }
        - name: PGPASSWORD
          valueFrom:
            secretKeyRef: { name: db-credentials, key: POSTGRES_PASSWORD }
        - name: POSTGRES_DB
          valueFrom:
            configMapKeyRef: { name: app-config, key: DB_NAME }
      volumeMounts:
        - { name: backup, mountPath: /backup }
      resources:
        requests: { cpu: 50m, memory: 64Mi }
        limits:   { cpu: 200m, memory: 128Mi }
      securityContext:
        allowPrivilegeEscalation: false
        capabilities: { drop: ["ALL"] }
        readOnlyRootFilesystem: true
  volumes:
    - name: backup
      persistentVolumeClaim:
        claimName: backup-pvc
