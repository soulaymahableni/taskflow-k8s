# Compte de consultation limité au namespace : lecture des Pods, de leurs logs et des Services.
apiVersion: v1
kind: ServiceAccount
metadata: { name: dev-viewer, namespace: taskapp }
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: { name: pod-viewer, namespace: taskapp }
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log", "services"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: { name: dev-viewer-binding, namespace: taskapp }
subjects:
  - kind: ServiceAccount
    name: dev-viewer
    namespace: taskapp
roleRef:
  kind: Role
  name: pod-viewer
  apiGroup: rbac.authorization.k8s.io
