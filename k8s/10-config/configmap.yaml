apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: taskapp
data:
  DB_HOST: db
  DB_PORT: "5432"
  DB_NAME: taskdb
  API_PORT: "3000"
---
# Configuration nginx du frontend, montée en fichier (subPath).
# Après une modification : kubectl -n taskapp rollout restart deployment/frontend
apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-config
  namespace: taskapp
data:
  default.conf: |
    server {
      listen 8080;
      location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
      }
      location /api/ {
        proxy_pass http://api-svc:3000/;
      }
    }
