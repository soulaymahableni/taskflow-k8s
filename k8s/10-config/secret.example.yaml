# MODÈLE versionné dans Git avec de FAUSSES valeurs.
# Le vrai fichier (secret.yaml) est généré par kubectl et ignoré par Git (.gitignore).
apiVersion: v1
kind: Secret
metadata:
  name: db-credentials
  namespace: taskapp
type: Opaque
stringData:
  POSTGRES_USER: exemple-utilisateur
  POSTGRES_PASSWORD: exemple-mot-de-passe
  JWT_SECRET: exemple-cle-jwt
